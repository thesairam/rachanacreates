server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: unknown paths are served index.html so Vue Router handles them
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-term cache for hashed static assets (JS/CSS/fonts/images)
    location ~* \.(js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
