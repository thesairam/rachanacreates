server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: unknown paths are served index.html so Vue Router handles them
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Disable cache for images to ensure updates are visible immediately
    location ~* \.(png|jpg|jpeg|gif|svg|webp)$ {
        expires off;
        add_header Cache-Control "no-store, must-revalidate";
        access_log off;
    }
    # Keep long-term cache for JS/CSS/fonts
    location ~* \.(js|css|woff2?|ttf|eot|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
